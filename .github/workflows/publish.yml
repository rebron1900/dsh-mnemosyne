name: Publish to npm

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: |
          spec="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already on the registry; nothing to publish"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  storefront:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check published version and open storefront PR
        run: |
          gh auth setup-git
          node scripts/sync-storefront.mjs
        env:
          GH_TOKEN: ${{ secrets.STOREFRONT_TOKEN }}
