# dsh-mnemosyne — Mnemosyne memory tools for DeepSeek Harness.
# Proxies every operation to the local `mnemosyne` CLI and keeps all data
# under ~/.dsh/mnemosyne. Config keys mirror the Config schema in src/index.js.
- insert:
    - id: mnemosyne
      name: dsh-mnemosyne
      config:
        cli: mnemosyne
        defaultTopK: 5
        timeoutMs: 20000
        dataDir: ~/.dsh/mnemosyne
        # Automatic memory features live in the DSH settings "mnemosyne"
        # namespace (panel toggles) — do NOT pin them here; a pinned value
        # would fight the settings document and the panel.