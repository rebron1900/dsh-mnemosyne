# dsh-mnemosyne — Mnemosyne memory tools for DeepSeek Harness.
# Proxies every operation to the local `mnemosyne` CLI and keeps all data
# under ~/.dsh/mnemosyne. Config keys mirror the Config schema in src/index.js.
- insert:
    - id: mnemosyne
      name: dsh-mnemosyne
      config:
        cli: mnemosyne
        defaultTopK: 5
        timeoutMs: 20000
        dataDir: ~/.dsh/mnemosyne
        # Automatic memory features (all default false — manual-only by default)
        promptSection: false
        autoSync: false
        autoPrefetch: false
        prefetchTopK: 5
        prefetchMinQueryLen: 3